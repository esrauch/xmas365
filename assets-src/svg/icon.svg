<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Launcher icon: Leap Day's face in round glasses, in front of a Webs (Hashi) puzzle:
       knots joined by silk threads, single and double, every count satisfied
       (3 = 2 + 1, 4 = 2 + 2, 2 = 1 + 1, 3 = 2 + 1). Full bleed: phones round or mask the corners. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#4a3f78"/>
      <stop offset="1" stop-color="#211c3a"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- A faint spider web from the top-left corner. -->
  <g fill="none" stroke="#b9b2e8" stroke-width="3" opacity="0.28">
    <path d="M0 0 L300 120 M0 0 L220 260 M0 0 L110 330 M0 0 L330 30"/>
    <path d="M70 6 Q60 40 46 66 Q22 70 4 72"/>
    <path d="M150 14 Q128 80 96 136 Q48 146 6 150"/>
    <path d="M232 26 Q196 122 146 206 Q76 222 8 228"/>
  </g>
  <!-- Everything below is shrunk toward the centre so it stays inside Android's round crop
       (the maskable safe circle, radius 40% of the icon). -->
  <g transform="translate(256 256) scale(0.7) translate(-256 -256)">
  <!-- The puzzle: threads (double ones as two lines), then the knots, in red, white and blue
       as with the Fourth of July twist (joined knots never share a colour). -->
  <g stroke="#ece8ff" stroke-width="8" stroke-linecap="round">
    <line x1="74" y1="78" x2="438" y2="78" transform="translate(0 -9)"/>
    <line x1="74" y1="78" x2="438" y2="78" transform="translate(0 9)"/>
    <line x1="438" y1="78" x2="438" y2="440" transform="translate(-9 0)"/>
    <line x1="438" y1="78" x2="438" y2="440" transform="translate(9 0)"/>
    <line x1="74" y1="78" x2="74" y2="440"/>
    <line x1="74" y1="440" x2="438" y2="440"/>
  </g>
  <circle cx="74" cy="78" r="36" fill="#d9534f" stroke="#1f2430" stroke-width="8"/><text x="74" y="93" text-anchor="middle" font-family="'Arial Black', 'Helvetica Neue', Arial, system-ui, sans-serif" font-weight="900" font-size="42" fill="#ffffff">3</text>
  <circle cx="438" cy="78" r="36" fill="#3c6fd9" stroke="#1f2430" stroke-width="8"/><text x="438" y="93" text-anchor="middle" font-family="'Arial Black', 'Helvetica Neue', Arial, system-ui, sans-serif" font-weight="900" font-size="42" fill="#ffffff">4</text>
  <circle cx="74" cy="440" r="36" fill="#f4f1ea" stroke="#1f2430" stroke-width="8"/><text x="74" y="455" text-anchor="middle" font-family="'Arial Black', 'Helvetica Neue', Arial, system-ui, sans-serif" font-weight="900" font-size="42" fill="#1f2430">2</text>
  <circle cx="438" cy="440" r="36" fill="#d9534f" stroke="#1f2430" stroke-width="8"/><text x="438" y="455" text-anchor="middle" font-family="'Arial Black', 'Helvetica Neue', Arial, system-ui, sans-serif" font-weight="900" font-size="42" fill="#ffffff">3</text>
  
  <!-- The frog sits a little high, so its face (not its chin) is at the centre. -->
  <g transform="translate(0 -48)">
  <g fill="#1f2430" stroke="#1f2430" stroke-width="22" stroke-linejoin="round"><circle cx="174" cy="226" r="70"/><circle cx="338" cy="226" r="70"/><ellipse cx="256" cy="338" rx="176" ry="124"/></g>
  <g fill="#6cc447"><circle cx="174" cy="226" r="70"/><circle cx="338" cy="226" r="70"/><ellipse cx="256" cy="338" rx="176" ry="124"/></g>
  <!-- A paler chin, cheeks and a wide smile. -->
  <ellipse cx="256" cy="402" rx="112" ry="48" fill="#a8e07c"/>
  <ellipse cx="146" cy="352" rx="26" ry="18" fill="#ff7b93" opacity="0.75"/>
  <ellipse cx="366" cy="352" rx="26" ry="18" fill="#ff7b93" opacity="0.75"/>
  <circle cx="240" cy="300" r="6" fill="#1f2430"/>
  <circle cx="272" cy="300" r="6" fill="#1f2430"/>
  <path d="M168 342 Q256 412 344 342" fill="none" stroke="#1f2430" stroke-width="11" stroke-linecap="round"/>
  <!-- Round brass glasses over big eyes. -->
  <circle cx="174" cy="226" r="50" fill="#ffffff"/>
  <circle cx="338" cy="226" r="50" fill="#ffffff"/>
  <circle cx="182" cy="232" r="24" fill="#0e1018"/>
  <circle cx="330" cy="232" r="24" fill="#0e1018"/>
  <circle cx="191" cy="222" r="8" fill="#ffffff"/>
  <circle cx="339" cy="222" r="8" fill="#ffffff"/>
  <circle cx="174" cy="226" r="50" fill="#a7d8f0" opacity="0.22"/>
  <circle cx="338" cy="226" r="50" fill="#a7d8f0" opacity="0.22"/>
  <path d="M146 200 a50 50 0 0 1 40 -22" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.8"/>
  <path d="M310 200 a50 50 0 0 1 40 -22" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.8"/>
  <g fill="none" stroke="#1f2430" stroke-width="20">
    <circle cx="174" cy="226" r="54"/><circle cx="338" cy="226" r="54"/>
    <path d="M226 218 Q256 200 286 218"/>
  </g>
  <g fill="none" stroke="#e0b24a" stroke-width="10">
    <circle cx="174" cy="226" r="54"/><circle cx="338" cy="226" r="54"/>
    <path d="M226 218 Q256 200 286 218"/>
  </g>
  </g>
  </g>
</svg>
